# Local stand-ins for cloud services. Nothing here costs money or talks to AWS.
#   storage         -> plays the role of Amazon S3 (RustFS speaks the S3 API)
#   create-buckets  -> one-shot job: creates the buckets with the official AWS CLI (idempotent)
#
# Usage:  cp .env.example .env   (then edit secrets)
#         docker compose up -d
#         docker compose down          # stop (data is kept in the named volume)
#         docker compose down -v       # stop AND delete all stored objects
name: neural-lakehouse

services:
  storage:
    # Pinned version (never `latest`): reproducible, and immune to the image vanishing/changing.
    # MinIO was the original plan, but its images are no longer published (see LEARNING_LOG).
    image: rustfs/rustfs:1.0.6
    container_name: nl-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_API_PORT:-9000}:9000"          # S3 API (what PyIceberg / AWS CLI talk to)
      - "${S3_CONSOLE_PORT:-9001}:9001"      # web console (for humans)
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  create-buckets:
    image: amazon/aws-cli:2.42.1
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    # IDEMPOTENT: create each bucket only if it does not exist yet (safe to run many times).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for b in raw lakehouse; do
          if aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$b" 2>/dev/null; then
            echo "bucket $$b already exists"
          else
            aws --endpoint-url http://storage:9000 s3 mb "s3://$$b"
          fi
        done
    restart: "no"

volumes:
  storage-data:
